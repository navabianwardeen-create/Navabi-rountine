<body>
<style>
  :root {
    --ink: #17140F;
    --canvas: #221D16;
    --canvas-2: #2B251B;
    --rope: #3D3527;
    --rope-light: #4A4130;
    --chalk: #F3EEE4;
    --chalk-dim: #A69C89;
    --chalk-faint: #6B6250;
    --brass: #D9A752;
    --brass-bg: rgba(217,167,82,0.14);
    --win: #6FA36E;
    --win-bg: rgba(111,163,110,0.16);
    --loss: #C15C50;
    --loss-bg: rgba(193,92,80,0.16);
    --steel: #7C93AD;
    --steel-bg: rgba(124,147,173,0.16);
    --ember: #E2803F;
    --ember-bg: rgba(226,128,63,0.16);
    --font-display: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    --font-mono: ui-monospace, 'SF Mono', 'Cascadia Mono', 'Roboto Mono', Consolas, 'Courier New', monospace;
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 16px;
    --shadow-card: 0 4px 16px rgba(0,0,0,0.35);
    --shadow-inset: inset 0 2px 8px rgba(0,0,0,0.45), inset 0 0 0 1px var(--rope);
  }

  * { box-sizing: border-box; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }

  .nv-root {
    font-family: var(--font-display);
    background: var(--ink);
    color: var(--chalk);
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    position: relative;
    -webkit-tap-highlight-color: transparent;
  }

  .nv-root button { font-family: inherit; }
  .nv-root input { font-family: inherit; }

  /* ---------- Header ---------- */
  .nv-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 20px 14px;
    border-bottom: 1px solid var(--rope);
  }
  .nv-brand-eyebrow {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--brass);
    margin: 0 0 2px;
  }
  .nv-brand-name {
    font-size: 20px;
    font-weight: 800;
    letter-spacing: -0.01em;
    margin: 0;
    color: var(--chalk);
  }
  .nv-sync {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .nv-sync-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--win);
    transition: background 0.3s ease;
  }
  .nv-sync-dot.pending {
    background: var(--brass);
    animation: nv-pulse 1.4s ease-in-out infinite;
  }
  @keyframes nv-pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
  .nv-sync-label {
    font-size: 10px;
    color: var(--chalk-faint);
    letter-spacing: 0.04em;
  }

  /* ---------- Main / Screens ---------- */
  .nv-main {
    flex: 1;
    overflow-y: auto;
    padding: 18px 18px 100px;
    animation: nv-rise 0.35s ease both;
  }
  @keyframes nv-rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

  .nv-eyebrow {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--brass);
    margin: 0 0 4px;
  }
  .nv-screen-title {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.01em;
    margin: 0 0 18px;
    color: var(--chalk);
  }
  .nv-title-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 18px;
  }
  .nv-title-row .nv-screen-title { margin-bottom: 0; }

  .nv-text-btn {
    background: none;
    border: none;
    color: var(--chalk-dim);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    padding: 6px 4px;
  }
  .nv-text-btn:active { opacity: 0.6; }
  .nv-text-btn.active-edit { color: var(--loss); }

  /* ---------- Chips ---------- */
  .nv-chip-row {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 4px;
    margin-bottom: 20px;
    scrollbar-width: none;
  }
  .nv-chip-row::-webkit-scrollbar { display: none; }
  .nv-chip {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--canvas);
    border: 1px solid var(--rope);
    color: var(--chalk-dim);
    padding: 9px 14px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;

<script>
(function(){
"use strict";

/* =========================================================
   STORAGE KEYS
   ========================================================= */
var KEYS = {
  habits: 'navabi-habits',
  habitLogs: 'navabi-habit-logs',
  gymLog: 'navabi-gym-log',
  boxing: 'navabi-boxing-settings'
};

/* =========================================================
   DATE UTILS
   ========================================================= */
function pad2(n){ return String(n).padStart(2,'0'); }
function dateKey(y,m,d){ return y+'-'+pad2(m+1)+'-'+pad2(d); }
function dateKeyFromDate(dt){ return dateKey(dt.getFullYear(), dt.getMonth(), dt.getDate()); }
function parseDateKey(k){
  var parts = k.split('-');
  return new Date(parseInt(parts[0],10), parseInt(parts[1],10)-1, parseInt(parts[2],10));
}
function startOfToday(){ var d = new Date(); d.setHours(0,0,0,0); return d; }
function todayKey(){ return dateKeyFromDate(startOfToday()); }
function daysBetween(d1,d2){ return Math.round((d2.getTime()-d1.getTime())/86400000); }
function getMonthMatrix(year, month){
  var first = new Date(year, month, 1);
  var startWeekday = first.getDay();
  var daysInMonth = new Date(year, month+1, 0).getDate();
  var cells = [];
  for (var i=0;i<startWeekday;i++) cells.push(null);
  for (var d=1; d<=daysInMonth; d++) cells.push(d);
  return cells;
}
function monthLabel(year, month){
  return new Date(year, month, 1).toLocaleString('en-US', { month: 'long', year: 'numeric' });
}
function fullDateLabel(key){
  var d = parseDateKey(key);
  return d.toLocaleString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
}
function escapeHtml(str){
  var div = document.createElement('div');
  div.textContent = str == null ? '' : String(str);
  return div.innerHTML;
}
function fmtClock(totalSeconds){
  var s = Math.max(0, Math.ceil(totalSeconds));
  var m = Math.floor(s/60);
  var r = s%60;
  return pad2(m)+':'+pad2(r);
}

/* =========================================================
   STATE
   ========================================================= */
var state = {
  loaded: false,
  activeTab: 'habits',
  gymSubTab: 'calendar',
  habits: [],
  activeHabitId: null,
  habitEditMode: false,
  habitLogs: {},
  habitCalYear: startOfToday().getFullYear(),
  habitCalMonth: startOfToday().getMonth(),
  gymLog: {},
  gymCalYear: startOfToday().getFullYear(),
  gymCalMonth: startOfToday().getMonth(),
  boxing: { roundSec: 120, restSec: 90, rounds: 3, soundOn: true },
  currentModal: null
};

var bt = {
  running: false,
  phase: 'idle',
  currentRound: 1,
  phaseStartTs: null,
  remainingAtPause: null,
  interval: null,
  lastTickSecond: null
};

/* =========================================================
   STORAGE LAYER (with retry)
   ========================================================= */
var dirtyKeys = {};
function hasStorage(){ return (typeof window !== 'undefined' && !!window.storage); }
var LOCAL_PREFIX = 'nv:';
var hasLocal = (function(){
  try {
    var t = '__nv_test__';
    window.localStorage.setItem(t, '1');
    window.localStorage.removeItem(t);
    return true;
  } catch(e){ return false; }
})();
function loadFromLocal(key, fallback){
  if (!hasLocal) return fallback;
  try {
    var raw = window.localStorage.getItem(LOCAL_PREFIX + key);
    if (raw == null) return fallback;
    return JSON.parse(raw);
  } catch(e){ return fallback; }
}
function saveToLocal(key, value){
  if (!hasLocal) return false;
  try { window.localStorage.setItem(LOCAL_PREFIX + key, JSON.stringify(value)); return true; }
  catch(e){ return false; }
}

function stateSliceForKey(key){
  if (key === KEYS.habits) return state.habits;
  if (key === KEYS.habitLogs) return state.habitLogs;
  if (key === KEYS.gymLog) return state.gymLog;
  if (key === KEYS.boxing) return state.boxing;
  return null;
}

function setSyncPending(pending){
  var dot = document.getElementById('nvSyncDot');
  if (!dot) return;
  if (pending) dot.classList.add('pending');
  else dot.classList.remove('pending');
}

/* Prefer Claude's remote artifact storage when present (viewing inside Claude);
   otherwise fall back to the browser's own localStorage (standalone / installed mode). */
function loadKey(key, fallback){
  if (hasStorage()){
    return window.storage.get(key, false).then(function(res){
      if (res && res.value !== undefined && res.value !== null){
        try { return JSON.parse(res.value); } catch(e){ return loadFromLocal(key, fallback); }
      }
      return loadFromLocal(key, fallback);
    }).catch(function(){ return loadFromLocal(key, fallback); });
  }
  return Promise.resolve(loadFromLocal(key, fallback));
}

function saveKey(key, value){
  var localOk = saveToLocal(key, value);
  if (hasStorage()){
    window.storage.set(key, JSON.stringify(value), false).then(function(res){
      if (!res) throw new Error('save failed');
      delete dirtyKeys[key];
      setSyncPending(Object.keys(dirtyKeys).length > 0);
    }).catch(function(){
      dirtyKeys[key] = true;
      setSyncPending(true);
    });
  } else {
    setSyncPending(!localOk);
  }
}

function persist(keyName){
  saveKey(keyName, stateSliceForKey(keyName));
}

setInterval(function(){
  var keys = Object.keys(dirtyKeys);
  if (!hasStorage() || keys.length === 0) return;
  keys.forEach(function(k){ saveKey(k, stateSliceForKey(k)); });
}, 20000);

function loadAll(){
  return Promise.all([
    loadKey(KEYS.habits, []),
    loadKey(KEYS.habitLogs, {}),
    loadKey(KEYS.gymLog, {}),
    loadKey(KEYS.boxing, { roundSec: 120, restSec: 90, rounds: 3, soundOn: true })
  ]).then(function(results){
    state.habits = results[0] || [];
    state.habitLogs = results[1] || {};
    state.gymLog = results[2] || {};
    var b = results[3] || {};
    state.boxing.roundSec = b.roundSec || 120;
    state.boxing.restSec = (b.restSec === 0) ? 0 : (b.restSec || 90);
    state.boxing.rounds = b.rounds || 3;
    state.boxing.soundOn = b.soundOn !== false;
    if (state.habits.length > 0) state.activeHabitId = state.habits[0].id;
    state.loaded = true;
  });
}

/* =========================================================
   HABIT LOGIC
   ========================================================= */
function getHabit(id){
  for (var i=0;i<state.habits.length;i++) if (state.habits[i].id === id) return state.habits[i];
  return null;
}
function habitLog(id){
  if (!state.habitLogs[id]) state.habitLogs[id] = {};
  return state.habitLogs[id];
}
function calcStreaks(habit, log){
  var redDates = Object.keys(log).filter(function(d){ return log[d] === 'loss'; }).sort();
  var resetPoints = [parseDateKey(habit.createdAt)];
  redDates.forEach(function(d){ resetPoints.push(parseDateKey(d)); });
  var today = startOfToday();
  var best = 0;
  for (var i=0;i<resetPoints.length-1;i++){
    best = Math.max(best, daysBetween(resetPoints[i], resetPoints[i+1]));
  }
  var current = Math.max(0, daysBetween(resetPoints[resetPoints.length-1], today));
  best = Math.max(best, current);
  return { current: current, best: best };
}
function monthHabitStats(log, year, month){
  var prefix = year+'-'+pad2(month+1);
  var win = 0, loss = 0;
  Object.keys(log).forEach(function(k){
    if (k.indexOf(prefix) === 0){
      if (log[k] === 'win') win++;
      else if (log[k] === 'loss') loss++;
    }
  });
  return { win: win, loss: loss };
}

/* =========================================================
   GYM LOGIC
   ========================================================= */
function gymDay(key){
  if (!state.gymLog[key]) state.gymLog[key] = { attended: false, exercises: [] };
  return state.gymLog[key];
}
function monthGymCount(year, month){
  var prefix = year+'-'+pad2(month+1);
  var count = 0;
  Object.keys(state.gymLog).forEach(function(k){
    if (k.indexOf(prefix) === 0 && state.gymLog[k].attended) count++;
  });
  return count;
}
function formatExercise(ex){
  var parts = [];
  if (ex.sets && ex.reps) parts.push(ex.sets+'\u00D7'+ex.reps);
  else if (ex.sets) parts.push(ex.sets+' sets');
  else if (ex.reps) parts.push(ex.reps+' reps');
  if (ex.weight) parts.push(ex.weight+'kg');
  return parts.length ? (ex.name+' \u2014 '+parts.join(' \u00B7 ')) : ex.name;
}
function getKnownExerciseNames(){
  var names = {};
  Object.keys(state.gymLog).forEach(function(k){
    (state.gymLog[k].exercises||[]).forEach(function(ex){ names[ex.name] = true; });
  });
  return Object.keys(names).sort();
}

/* =========================================================

   ========================================================= */
function renderCalendar(opts){
  var cells = getMonthMatrix(opts.year, opts.month);
  var tKey = todayKey();
  var isCurrentMonth = (opts.year === startOfToday().getFullYear() && opts.month === startOfToday().getMonth());
  var html = '';
  html += '<div class="nv-cal-header">';
  html += '<button class="nv-cal-nav" data-action="calNav" data-context="'+opts.context+'" data-dir="-1">\u2039</button>';
  html += '<span class="nv-cal-title">'+monthLabel(opts.year, opts.month)+'</span>';
  html += '<button class="nv-cal-nav" data-action="calNav" data-context="'+opts.context+'" data-dir="1" '+(isCurrentMonth?'disabled':'')+'>\u203A</button>';
  html += '</div>';
  html += '<div class="nv-cal-grid">';
  ['S','M','T','W','T','F','S'].forEach(function(d){ html += '<div class="nv-cal-wd">'+d+'</div>'; });
  cells.forEach(function(day){
    if (day === null){ html += '<div class="nv-cal-day empty"></div>'; return; }
    var key = dateKey(opts.year, opts.month, day);
    var cls = opts.markerFn(key);
    var isToday = key === tKey;
    var isFuture = key > tKey;
    var classes = 'nv-cal-day' + (cls ? ' '+cls : '') + (isToday?' today':'') + (isFuture?' future':'');
    if (isFuture){
      html += '<div class="'+classes+'">'+day+'</div>';
    } else {
      html += '<button class="'+classes+'" data-action="dayClick" data-context="'+opts.context+'" data-date="'+key+'">'+day+'</button>';
    }
  });
  html += '</div>';
  return html;
}

/* =========================================================
   BOXING TIMER
   ========================================================= */
function phaseDuration(phase){
  if (phase === 'ready') return 5;
  if (phase === 'round') return state.boxing.roundSec;
  if (phase === 'rest') return state.boxing.restSec;
  return 0;
}
function getRemaining(){
  if (bt.phase === 'idle') return state.boxing.roundSec;
  if (bt.phase === 'done') return 0;
  if (!bt.running) return bt.remainingAtPause != null ? bt.remainingAtPause : phaseDuration(bt.phase);
  var dur = phaseDuration(bt.phase);
  var elapsed = (Date.now() - bt.phaseStartTs) / 1000;
  return Math.max(0, dur - elapsed);
}

var audioCtx = null;
function getAudioCtx(){
  if (!state.boxing.soundOn) return null;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  } catch(e){ return null; }
}
function beep(freq, duration, delay, vol){
  var ctx = getAudioCtx();
  if (!ctx) return;
  try {
    var t0 = ctx.currentTime + (delay||0);
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.frequency.value = freq;
    osc.type = 'sine';
    gain.gain.setValueAtTime(vol||0.2, t0);
    gain.gain.exponentialRampToValueAtTime(0.001, t0 + duration/1000);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(t0); osc.stop(t0 + duration/1000);
  } catch(e){}
}
function vibrate(pattern){
  try { if (navigator.vibrate) navigator.vibrate(pattern); } catch(e){}
}
function soundReady(){ beep(520,120,0,0.16); vibrate(80); }
function soundRoundStart(){ beep(660,120,0,0.22); beep(880,120,0.14,0.22); beep(1100,220,0.28,0.22); vibrate([180]); }
function soundRestStart(){ beep(440,320,0,0.18); vibrate([100,60,100]); }
function soundDone(){ beep(660,150,0,0.2); beep(880,150,0.17,0.2); beep(1100,150,0.34,0.2); beep(1320,320,0.51,0.2); vibrate([200,100,200,100,200]); }
function soundTick(){ beep(1000,70,0,0.14); }

function startTimerInterval(){
  clearInterval(bt.interval);
  bt.interval = setInterval(tick, 250);
}
function tick(){
  if (!bt.running) return;
  var remaining = getRemaining();
  var wholeSecLeft = Math.ceil(remaining);
  if (wholeSecLeft <= 3 && wholeSecLeft >= 1 && wholeSecLeft !== bt.lastTickSecond && remaining > 0.05){
    bt.lastTickSecond = wholeSecLeft;
    soundTick();
  }
  if (remaining <= 0){
    advancePhase();
  }
  renderTimerFace();
}
function advancePhase(){
  bt.lastTickSecond = null;
  if (bt.phase === 'ready'){
    bt.phase = 'round';
    bt.currentRound = 1;
    bt.phaseStartTs = Date.now();
    soundRoundStart();
  } else if (bt.phase === 'round'){
    if (bt.currentRound >= state.boxing.rounds){
      bt.phase = 'done';
      bt.running = false;
      clearInterval(bt.interval);
      soundDone();
      logBoxingSessionToGym();
    } else {
      bt.phase = 'rest';
      bt.phaseStartTs = Date.now();
      soundRestStart();
    }
  } else if (bt.phase === 'rest'){
    bt.currentRound += 1;
    bt.phase = 'round';
    bt.phaseStartTs = Date.now();
    soundRoundStart();
  }
  renderBoxingControls();
}
function timerStart(){
  if (bt.running) return;
  if (bt.phase === 'idle' || bt.phase === 'done'){
    bt.phase = 'ready';
    bt.currentRound = 1;
    bt.phaseStartTs = Date.now();
    bt.running = true;
    soundReady();
  } else {
    var dur = phaseDuration(bt.phase);
    var elapsed = dur - (bt.remainingAtPause != null ? bt.remainingAtPause : dur);
    bt.phaseStartTs = Date.now() - elapsed*1000;
    bt.running = true;
  }
  startTimerInterval();
  renderBoxingControls();
}
function timerPause(){
  if (!bt.running) return;
  bt.remainingAtPause = getRemaining();
  bt.running = false;
  clearInterval(bt.interval);
  renderBoxingControls();
}
function timerReset(){
  bt.running = false;
  clearInterval(bt.interval);
  bt.phase = 'idle';
  bt.currentRound = 1;
  bt.phaseStartTs = null;
  bt.remainingAtPause = null;
  bt.lastTickSecond = null;
  renderScreen();
}
function logBoxingSessionToGym(){
  var key = todayKey();
  var day = gymDay(key);
  day.attended = true;
  day.exercises.push({
    id: 'ex_'+Date.now(),
    name: 'Boxing session \u2014 ' + state.boxing.rounds + ' rounds',
    sets: state.boxing.rounds,
    reps: null,
    weight: null
  });
  persist(KEYS.gymLog);
}

function ringCircumference(){ return 2*Math.PI*90; }
function renderTimerFace(){
  var ring = document.getElementById('nvRingFg');
  var timeEl = document.getElementById('nvTimerTime');
  var phaseEl = document.getElementById('nvTimerPhase');
  var roundEl = document.getElementById('nvTimerRound');
  if (!ring || !timeEl) return;
  var remaining = getRemaining();
  var dur = phaseDuration(bt.phase) || state.boxing.roundSec;
  var frac = bt.phase === 'idle' ? 1 : (bt.phase === 'done' ? 0 : Math.max(0, remaining/dur));
  var circ = ringCircumference();
  ring.style.strokeDasharray = circ;
  ring.style.strokeDashoffset = circ * (1 - frac);
  ring.setAttribute('class', 'nv-ring-fg ' + (bt.phase==='idle' ? 'ready' : bt.phase));

  timeEl.textContent = bt.phase === 'idle' ? fmtClock(state.boxing.roundSec) : fmtClock(remaining);
  var phaseLabels = { idle: 'Ready to start', ready: 'Get ready', round: 'Round', rest: 'Rest', done: 'Complete' };
  phaseEl.textContent = phaseLabels[bt.phase];
  phaseEl.setAttribute('class', 'nv-timer-phase ' + bt.phase);
  roundEl.textContent = (bt.phase==='round'||bt.phase==='rest') ? ('Round '+bt.currentRound+' of '+state.boxing.rounds) : (bt.phase==='done' ? (state.boxing.rounds+' rounds done') : '');
}
function renderBoxingControls(){
  var primary = document.getElementById('nvTimerPrimaryBtn');
  var resetBtn = document.getElementById('nvTimerResetBtn');
  if (!primary) { renderTimerFace(); return; }
  var label = 'Start';
  if (bt.running) label = 'Pause';
  else if (bt.phase !== 'idle' && bt.phase !== 'done') label = 'Resume';
  primary.textContent = label;
  primary.setAttribute('data-action', bt.running ? 'timerPause' : 'timerStart');
  if (resetBtn) resetBtn.style.visibility = (bt.phase === 'idle') ? 'hidden' : 'visible';
  var settingsCard = document.getElementById('nvBoxingSettings');
  if (settingsCard){
    var disabled = bt.phase !== 'idle';
    var steppers = settingsCard.querySelectorAll('.nv-stepper-btn');
    for (var i=0;i<steppers.length;i++) steppers[i].disabled = disabled;
  }
  renderTimerFace();
}

function renderBoxingSub(){
  var html = '';
  html += '<div class="nv-boxing-settings" id="nvBoxingSettings">';
  html += settingRow('Round', fmtClock(state.boxing.roundSec), 'round', 15);
  html += settingRow('Rest', fmtClock(state.boxing.restSec), 'rest', 15);
  html += settingRowRounds();
  html += '</div>';

  html += '<div class="nv-boxing-head">';
  html += '<button class="nv-mute-btn" data-action="toggleMute" title="Toggle sound">' + (state.boxing.soundOn ? muteIconOn() : muteIconOff()) + '</button>';
  html += '</div>';

  html += '<div class="nv-timer-wrap">';
  html += '<svg class="nv-timer-ring" viewBox="0 0 200 200">';
  html += '<circle class="nv-ring-bg" cx="100" cy="100" r="90"></circle>';
  html += '<circle class="nv-ring-fg ready" id="nvRingFg" cx="100" cy="100" r="90"></circle>';
  html += '</svg>';
  html += '<div class="nv-timer-center">';
  html += '<span class="nv-timer-phase idle" id="nvTimerPhase">Ready to start</span>';
  html += '<span class="nv-timer-time" id="nvTimerTime">'+fmtClock(state.boxing.roundSec)+'</span>';
  html += '<span class="nv-timer-round" id="nvTimerRound"></span>';
  html += '</div>';
  html += '</div>';

  html += '<div class="nv-timer-controls">';
  html += '<button class="nv-btn-timer-secondary" id="nvTimerResetBtn" data-action="timerReset" style="visibility:hidden">Reset</button>';
  html += '<button class="nv-btn-timer-primary" id="nvTimerPrimaryBtn" data-action="'+(bt.running?'timerPause':'timerStart')+'">'+(bt.running?'Pause':(bt.phase!=='idle'&&bt.phase!=='done'?'Resume':'Start'))+'</button>';
  html += '</div>';
  return html;
}
function settingRow(label, display, key, step){
  return '<div class="nv-setting-row"><span class="nv-setting-label">'+label+' time</span>'
    + '<div class="nv-stepper">'
    + '<button class="nv-stepper-btn" data-action="adjBoxingTime" data-key="'+key+'" data-delta="-'+step+'"'+(bt.phase!=='idle'?' disabled':'')+'>\u2212</button>'
    + '<span class="nv-stepper-value">'+display+'</span>'
    + '<button class="nv-stepper-btn" data-action="adjBoxingTime" data-key="'+key+'" data-delta="'+step+'"'+(bt.phase!=='idle'?' disabled':'')+'>+</button>'
    + '</div></div>';
}
function settingRowRounds(){
  return '<div class="nv-setting-row"><span class="nv-setting-label">Rounds</span>'
    + '<div class="nv-stepper">'
    + '<button class="nv-stepper-btn" data-action="adjBoxingRounds" data-delta="-1"'+(bt.phase!=='idle'?' disabled':'')+'>\u2212</button>'
    + '<span class="nv-stepper-value">'+state.boxing.rounds+'</span>'
    + '<button class="nv-stepper-btn" data-action="adjBoxingRounds" data-delta="1"'+(bt.phase!=='idle'?' disabled':'')+'>+</button>'
    + '</div></div>';
}
function muteIconOn(){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="4 9 4 15 8 15 13 20 13 4 8 9"/><path d="M17 8a5 5 0 0 1 0 8"/></svg>'; }
function muteIconOff(){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="4 9 4 15 8 15 13 20 13 4 8 9"/><line x1="17" y1="9" x2="22" y2="14"/><line x1="22" y1="9" x2="17" y2="14"/></svg>'; }

/* =========================================================
   MAIN RENDER DISPATCH
   ========================================================= */
function renderScreen(){
  document.getElementById('nvNavHabits').classList.toggle('active', state.activeTab==='habits');
  document.getElementById('nvNavGym').classList.toggle('active', state.activeTab==='gym');
  if (state.activeTab === 'habits') renderHabitsScreen();
  else renderGymScreen();
}

/* =========================================================
   ACTION HANDLERS
   ========================================================= */
function handleAction(action, el){
  if (action === 'setTab'){
    state.activeTab = el.getAttribute('data-tab');
    renderScreen();
    return;
  }
  if (action === 'setGymSub'){
    state.gymSubTab = el.getAttribute('data-sub');
    renderScreen();
    return;
  }
  if (action === 'toggleHabitEdit'){
    state.habitEditMode = !state.habitEditMode;
    renderScreen();
    return;
  }
  if (action === 'selectHabit'){
    state.activeHabitId = el.getAttribute('data-id');
    renderScreen();
    return;
  }
  if (action === 'openAddHabit'){
    openModalFor({ type: 'addHabit' });
    setTimeout(function(){ var n = document.getElementById('nvNewHabitName'); if (n) n.focus(); }, 80);
    return;
  }
  if (action === 'confirmAddHabit'){
    var input = document.getElementById('nvNewHabitName');
    var name = (input.value || '').trim();
    if (!name) { input.focus(); return; }
    var id = 'h_'+Date.now();
    state.habits.push({ id: id, name: name, createdAt: todayKey() });
    state.habitLogs[id] = {};
    state.activeHabitId = id;
    state.habitCalYear = startOfToday().getFullYear();
    state.habitCalMonth = startOfToday().getMonth();
    persist(KEYS.habits); persist(KEYS.habitLogs);
    closeModal();
    renderScreen();
    return;
  }
  if (action === 'askDeleteHabit'){
    openModalFor({ type: 'confirmDeleteHabit', habitId: el.getAttribute('data-id') });
    return;
  }
  if (action === 'deleteHabit'){
    var did = el.getAttribute('data-id');
    state.habits = state.habits.filter(function(h){ return h.id !== did; });
    delete state.habitLogs[did];
    if (state.activeHabitId === did) state.activeHabitId = state.habits.length ? state.habits[0].id : null;
    state.habitEditMode = false;
    persist(KEYS.habits); persist(KEYS.habitLogs);
    closeModal();
    renderScreen();
    return;
  }
  if (action === 'calNav'){
    var ctx = el.getAttribute('data-context');
    var dir = parseInt(el.getAttribute('data-dir'),10);
    if (ctx === 'habit'){
      var hm = state.habitCalMonth + dir;
      var hy = state.habitCalYear;
      if (hm < 0){ hm = 11; hy--; } else if (hm > 11){ hm = 0; hy++; }
      state.habitCalMonth = hm; state.habitCalYear = hy;
    } else {
      var gm = state.gymCalMonth + dir;
      var gy = state.gymCalYear;
      if (gm < 0){ gm = 11; gy--; } else if (gm > 11){ gm = 0; gy++; }
      state.gymCalMonth = gm; state.gymCalYear = gy;
    }
    renderScreen();
    return;
  }
  if (action === 'dayClick'){
    var context = el.getAttribute('data-context');
    var date = el.getAttribute('data-date');
    if (context === 'habit') openModalFor({ type: 'habitDay', habitId: state.activeHabitId, date: date });
    else openModalFor({ type: 'gymDay', date: date });
    return;
  }
  if (action === 'setHabitDay'){
    var hId = el.getAttribute('data-habit');
    var dKey = el.getAttribute('data-date');
    var val = el.getAttribute('data-value');
    habitLog(hId)[dKey] = val;
    persist(KEYS.habitLogs);
    closeModal();
    renderScreen();
    return;
  }
  if (action === 'clearHabitDay'){
    var hId2 = el.getAttribute('data-habit');
    var dKey2 = el.getAttribute('data-date');
    delete habitLog(hId2)[dKey2];
    persist(KEYS.habitLogs);
    closeModal();
    renderScreen();
    return;
  }
  if (action === 'toggleAttended'){
    var gKey = el.getAttribute('data-date');
    var day = gymDay(gKey);
    day.attended = el.checked;
    persist(KEYS.gymLog);
    renderScreen();
    return;
  }
  if (action === 'showAddExercise'){
    var addKey = el.getAttribute('data-date');
    state.currentModal = { type: 'gymDay', date: addKey };
    var sheet = document.getElementById('nvSheet');
    sheet.innerHTML = renderGymDayModal(addKey, true);
    setTimeout(function(){ var n = document.getElementById('nvExName'); if (n) n.focus(); }, 50);
    return;
  }
  if (action === 'addExercise'){
    var exKey = el.getAttribute('data-date');
    var nameEl = document.getElementById('nvExName');
    var name = (nameEl.value || '').trim();
    if (!name){ nameEl.focus(); return; }
    var sets = parseFloat(document.getElementById('nvExSets').value) || null;
    var reps = parseFloat(document.getElementById('nvExReps').value) || null;
    var weight = parseFloat(document.getElementById('nvExWeight').value) || null;
    var d = gymDay(exKey);
    d.exercises.push({ id: 'ex_'+Date.now(), name: name, sets: sets, reps: reps, weight: weight });
    d.attended = true;
    persist(KEYS.gymLog);
    state.currentModal = { type: 'gymDay', date: exKey };
    document.getElementById('nvSheet').innerHTML = renderGymDayModal(exKey, false);
    renderScreen();
    return;
  }
  if (action === 'deleteExercise'){
    var delKey = el.getAttribute('data-date');
    var exId = el.getAttribute('data-exid');
    var dd = gymDay(delKey);
    dd.exercises = dd.exercises.filter(function(e){ return e.id !== exId; });
    persist(KEYS.gymLog);
    document.getElementById('nvSheet').innerHTML = renderGymDayModal(delKey, false);
    renderScreen();
    return;
  }
  if (action === 'closeModal'){
    closeModal();
    return;
  }
  if (action === 'adjBoxingTime'){
    if (bt.phase !== 'idle') return;
    var key2 = el.getAttribute('data-key');
    var delta = parseInt(el.getAttribute('data-delta'),10);
    var field = key2 === 'round' ? 'roundSec' : 'restSec';
    var next = state.boxing[field] + delta;
    next = Math.max(15, Math.min(600, next));
    state.boxing[field] = next;
    persist(KEYS.boxing);
    renderScreen();
    return;
  }
  if (action === 'adjBoxingRounds'){
    if (bt.phase !== 'idle') return;
    var d2 = parseInt(el.getAttribute('data-delta'),10);
    state.boxing.rounds = Math.max(1, Math.min(20, state.boxing.rounds + d2));
    persist(KEYS.boxing);
    renderScreen();
    return;
  }
  if (action === 'toggleMute'){
    state.boxing.soundOn = !state.boxing.soundOn;
    persist(KEYS.boxing);
    renderScreen();
    return;
  }
  if (action === 'timerStart'){ timerStart(); return; }
  if (action === 'timerPause'){ timerPause(); return; }
  if (action === 'timerReset'){ timerReset(); return; }
}

document.getElementById('nvApp').addEventListener('click', function(e){
  if (e.target.id === 'nvOverlay'){ closeModal(); return; }
  var el = e.target.closest('[data-action]');
  if (!el) return;
  if (el.tagName === 'INPUT') return;
  handleAction(el.getAttribute('data-action'), el);
});
document.getElementById('nvApp').addEventListener('change', function(e){
  var el = e.target;
  if (el.matches('[data-action="toggleAttended"]')) handleAction('toggleAttended', el);
});

/* =========================================================
   INIT
   ========================================================= */
function boot(){
  document.getElementById('nvMain').innerHTML = '<div class="nv-empty"><p>Loading your log\u2026</p></div>';
  loadAll().then(function(){
    renderScreen();
  });
}
boot();

})();
</script>
